name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run checks and tests
        run: |
          php -v
          for test_name in check test_detection test_regression test_baseline \
            test_joomla_fingerprint test_codebase_scanner test_rate_limiter \
            test_storage test_worker_protocol; do
            echo "::group::$test_name"
            php "scripts/$test_name.php"
            echo "::endgroup::"
          done

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Deploy secrets are not set. See docs/auto-deploy.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's forced command decides what runs, so no command is sent.
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST"
